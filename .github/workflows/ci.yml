name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI does not start a VM, so it does not need tart.
  MISE_DISABLE_TOOLS: tart

jobs:
  # The test jobs are required checks, so a path filter on the workflow
  # would leave them pending. A job that its `if` skips counts as passed.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # A push to main tests every merge: a PR is not tested against the
          # newest main before it merges.
          if [ "$EVENT" != pull_request ]; then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # When the diff fails, the tests run.
          if ! git fetch --no-tags --depth=1 origin "$BASE" ||
            ! changed=$(git diff --name-only "$BASE" HEAD); then
            echo code=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -qE '\.go$|^go\.(mod|sum)$|/testdata/|^mise\.(toml|lock)$|^\.golangci|^\.github/workflows/ci\.yml$' <<<"$changed"; then
            echo code=true >> "$GITHUB_OUTPUT"
          else
            echo code=false >> "$GITHUB_OUTPUT"
          fi

  check:
    name: check (hooks, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: prek run --all-files

  test:
    name: test (${{ matrix.os }})
    # A failed changes job gives no output, so the tests run.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: go test -race ./...

  test-root:
    name: test (linux, root)
    # A failed changes job gives no output, so the tests run.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      # The peer uid checks need a second, real uid, so these tests skip
      # without root. A skip here is a failure: grep finds it.
      - shell: bash # adds pipefail, so a test failure is not hidden by tee
        run: |
          sudo env "PATH=$PATH" go test -race -count=1 -v \
            -run 'TestCrossUID|Impostor' ./internal/ipc/ | tee root-test.log
          ! grep -E -- '--- SKIP: (TestCrossUID|TestCrossUIDImpostor) ' root-test.log

  e2e:
    name: e2e (macOS, root)
    # A failed changes job gives no output, so the tests run.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      # The runner is disposable. Strict mode turns an unmet requirement into
      # a failure, so that a broken runner cannot pass as a skip.
      IFBOUND_E2E_DISPOSABLE: "1"
      IFBOUND_E2E_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: mise run e2e
