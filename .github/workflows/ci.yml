name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI does not start a VM, so it does not need tart.
  MISE_DISABLE_TOOLS: tart

jobs:
  check:
    name: check (hooks, lint, format)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: prek run --all-files

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: go test -race ./...

  test-root:
    name: test (linux, root)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # The peer uid checks need a second, real uid, so these tests skip
      # without root. A skip here is a failure: grep finds it.
      - shell: bash # adds pipefail, so a test failure is not hidden by tee
        run: |
          sudo env "PATH=$PATH" go test -race -count=1 -v \
            -run 'TestCrossUID|Impostor' ./internal/ipc/ | tee root-test.log
          ! grep -E -- '--- SKIP: (TestCrossUID|TestCrossUIDImpostor) ' root-test.log

  e2e:
    name: e2e (macOS, root)
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      # The runner is disposable. Strict mode turns an unmet requirement into
      # a failure, so that a broken runner cannot pass as a skip.
      IFBOUND_E2E_DISPOSABLE: "1"
      IFBOUND_E2E_STRICT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: mise run e2e
