name: vuln

on:
  push:
    branches: [main]
  pull_request:
  # A new advisory can affect code that did not change.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI does not start a VM, so it does not need tart.
  MISE_DISABLE_TOOLS: tart

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        # The call graph depends on build constraints.
        goos: [linux, darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7a4e45a543138629540c9a1616d08632b893e492 # v5.0.1
      - run: govulncheck ./...
        env:
          GOOS: ${{ matrix.goos }}
