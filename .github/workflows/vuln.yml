name: vuln

on:
  # The Go version from mise decides the standard library that is checked.
  pull_request:
    paths:
      - "**.go"
      - go.mod
      - go.sum
      - mise.toml
      - mise.lock
      - .github/workflows/vuln.yml
  # A new advisory can affect code that did not change. The daily run also
  # covers main after each merge.
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI does not start a VM, so it does not need tart.
  MISE_DISABLE_TOOLS: tart

jobs:
  govulncheck:
    name: govulncheck (${{ matrix.goos }})
    strategy:
      fail-fast: false
      matrix:
        # The call graph depends on build constraints.
        goos: [linux, darwin]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - run: govulncheck ./...
        env:
          GOOS: ${{ matrix.goos }}
