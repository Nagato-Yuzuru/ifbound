[tools]
go = "1.27.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.8.0"
"github:open-telemetry/weaver" = "0.28.0"
golangci-lint = "2.15.0"
jactionlint = "v2.4.0"
prek = "0.5.9"
# The local end-to-end VM needs a macOS host. CI sets MISE_DISABLE_TOOLS=tart.
tart = { version = "2.41.1", os = ["macos"] }

[env]
# Base image of the end-to-end guest, pinned by digest. A registry mirror
# serves the same digest: override the host in mise.local.toml.
IFBOUND_VM_IMAGE = "ghcr.io/cirruslabs/macos-golden-gate-base@sha256:5302a9ea6cd68c059d00fa253fe75c8ebdf4e0dc8c45d4e136ecc6e7a4c02b70"

[tasks."e2e:build"]
description = "Compile the end-to-end test binary for darwin, on the architecture of this host"
env = { GOOS = "darwin", CGO_ENABLED = "0" }
run = "go test -c -tags e2e -o bin/e2e.test ./e2e"

[tasks.e2e]
description = "Run end-to-end tests as root on this host. They run only where /var/db/ifbound-e2e-disposable exists (CI, VM)"
depends = ["e2e:build"]
# This task does not create the marker, so that it changes nothing on a
# development host. The test timeout is shorter than the timeout of the CI
# job. Thus a test that hangs fails with the stacks of all goroutines, and
# the job keeps the log.
run = '''
sudo env \
  IFBOUND_E2E_STRICT="${IFBOUND_E2E_STRICT:-}" \
  ./bin/e2e.test -test.v -test.timeout=10m
'''

[tasks."vm:e2e"]
description = "Run end-to-end tests in a headless tart guest. Clone and start the guest when necessary"
depends = ["e2e:build"]
usage = 'arg "[vm]" help="Name of the tart guest" default="ifbound-e2e"'
# The base image has passwordless sudo and the tart guest agent, which
# `tart exec` needs. The guest sees the repository read-only at /Volumes/My
# Shared Files/ifbound.
run = '''
vm="${usage_vm}"
if ! tart list --quiet --source local | grep -qx "$vm"; then
  tart clone "$IFBOUND_VM_IMAGE" "$vm"
fi
if ! tart exec "$vm" true 2>/dev/null; then
  nohup tart run --no-graphics --dir="ifbound:{{config_root}}:ro" "$vm" \
    >"{{config_root}}/bin/$vm.log" 2>&1 &
  tries=0
  until tart exec "$vm" true 2>/dev/null; do
    tries=$((tries + 1))
    if [ "$tries" -ge 90 ]; then
      echo "guest $vm is not ready after 180 s; see bin/$vm.log" >&2
      exit 1
    fi
    sleep 2
  done
fi
# The marker tells the tests that this guest is disposable.
tart exec "$vm" sudo touch /var/db/ifbound-e2e-disposable
# The guest agent's PATH does not include /sbin, where ifconfig and pfctl are.
tart exec "$vm" sudo env \
  PATH=/usr/bin:/bin:/usr/sbin:/sbin \
  IFBOUND_E2E_STRICT=1 \
  "/Volumes/My Shared Files/ifbound/bin/e2e.test" -test.v -test.timeout=10m
'''

# The semconv version lives in telemetry/manifest.yaml only. The task reads
# the version from the manifest and names the archive after it, so a new
# version never finds an old archive. Update the sha256 here with the
# version. The archive is a GitHub-generated tarball: its bytes can change
# without a new version. The sha256 check then fails loudly.
[tasks."telemetry:semconv"]
description = "Download the semconv archive that the telemetry registry depends on"
run = '''
set -eu
sum=3afc6489d348fba740e0d3646c5cb91e47a057b4e4cef60701c8636d4330fde9
ver=$(sed -n 's|^ *- schema_url: https://opentelemetry.io/schemas/\(.*\)$|\1|p' telemetry/manifest.yaml)
f=.cache/weaver/semconv-v$ver.tar.gz
if [ -z "$ver" ] || ! grep -qxF "    registry_path: $f[model]" telemetry/manifest.yaml; then
  echo "telemetry/manifest.yaml: registry_path must be $f[model]" >&2
  exit 1
fi
if [ -f "$f" ] && echo "$sum  $f" | shasum -a 256 -c --status; then exit 0; fi
mkdir -p "${f%/*}"
curl -fsSL -o "$f.tmp" "https://github.com/open-telemetry/semantic-conventions/archive/refs/tags/v$ver.tar.gz"
echo "$sum  $f.tmp" | shasum -a 256 -c --status
mv -f "$f.tmp" "$f"
'''

[tasks."telemetry:generate"]
description = "Generate the log attribute constants and docs/telemetry.md. Fail when a generated file does not match the files that git tracks"
depends = ["telemetry:semconv"]
run = '''
set -eu
weaver registry generate --v2 --quiet -r telemetry -t telemetry/.templates go internal/logattr
weaver registry generate --v2 --quiet -r telemetry -t telemetry/.templates markdown docs
# A working tree column that is not blank shows a changed, deleted, or
# untracked file. The check also catches a file that a template writes to a
# new path, and a generated file that a commit deleted.
stale=$(git status --porcelain --untracked-files=all -- internal/logattr docs/telemetry.md | grep '^.[^ ]' || true)
if [ -n "$stale" ]; then
  echo "generated files do not match the registry:" >&2
  echo "$stale" >&2
  exit 1
fi
'''
