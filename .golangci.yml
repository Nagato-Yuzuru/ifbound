version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - errorlint
    - err113
    - containedctx
    - contextcheck
    - exhaustive
    - gochecksumtype
    - bodyclose
    - noctx
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - nestif
    - revive
    - sloglint
    - nolintlint
    - godox
    - depguard
  settings:
    depguard:
      rules:
        toml-position-walk:
          # One walk over unstable.Parser gives the places of fields and finds
          # duplicate keys. A second walker would drift from it.
          files: ["$all", "!**/internal/policy/position.go"]
          deny:
            - pkg: github.com/pelletier/go-toml/v2/unstable
              desc: walk the TOML text only in internal/policy/position.go (newIndex)
    errcheck:
      check-blank: true # a blank drop needs //nolint:errcheck with a reason; nolintlint enforces the reason
    godox:
      keywords: [XXX, BUG] # the non-canonical spellings of WARN and FIXME
    errorlint:
      errorf: false # deliberate %v keeps foreign causes out of the %w contract chain
    sloglint:
      static-msg: true # variables go in attrs, not the message
    nolintlint:
      require-explanation: true
      require-specific: true
    gocognit:
      min-complexity: 20
    exhaustive:
      default-signifies-exhaustive: false # a default case never satisfies exhaustiveness
    gochecksumtype:
      default-signifies-exhaustive: false # same rule for sealed interfaces
    revive:
      rules:
        - name: context-as-argument
        - name: deep-exit
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - err113 # ad-hoc errors are fine in test bodies
          - gochecknoglobals

issues:
  uniq-by-line: false # report every finding, even on the same line

formatters:
  enable:
    - gofmt
