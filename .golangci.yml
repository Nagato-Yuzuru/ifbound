version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - errorlint
    - err113
    - containedctx
    - contextcheck
    - exhaustive
    - gochecksumtype
    - bodyclose
    - noctx
    - gochecknoglobals
    - gochecknoinits
    - gocognit
    - nestif
    - revive
    - sloglint
    - nolintlint
    - godox
    - depguard
    - forbidigo
  settings:
    depguard:
      rules:
        daemon-core-pure:
          # core.Step is a pure function: the shell in package daemon does
          # every I/O, and the time comes with each event. lax lets the
          # longer allow match net/netip win over the deny of net.
          files: ["**/internal/daemon/core/**"]
          list-mode: lax
          allow:
            - net/netip
          deny:
            - pkg: os
              desc: core does no I/O; the shell does it
            - pkg: context
              desc: core does not block or cancel; the shell does it
            - pkg: sync
              desc: core starts no goroutine and shares no state
            - pkg: syscall
              desc: core does no I/O; the shell does it
            - pkg: net
              desc: core does no I/O; the shell does it
        toml-position-walk:
          # One walk over unstable.Parser gives the places of fields and finds
          # duplicate keys. A second walker would drift from it.
          files: ["$all", "!**/internal/policy/position.go"]
          deny:
            - pkg: github.com/pelletier/go-toml/v2/unstable
              desc: walk the TOML text only in internal/policy/position.go (newIndex)
        pf-standalone:
          # pf is a public package that other tools can import. It does not
          # depend on ifbound. Every other package of the module is below
          # internal/ or cmd/.
          files: ["**/pf/*.go"]
          deny:
            - pkg: github.com/Nagato-Yuzuru/ifbound/internal
              desc: pf must not depend on ifbound
            - pkg: github.com/Nagato-Yuzuru/ifbound/cmd
              desc: pf must not depend on ifbound
        json-v2:
          # v2 matches member names exactly and refuses duplicate members
          # and invalid UTF-8. Tests keep v1: they decode the output of the
          # code with a second library.
          files: ["$all", "!$test"]
          deny:
            - pkg: encoding/json$
              desc: use encoding/json/v2
    forbidigo:
      forbid:
        # The exclusions below limit this rule to internal/daemon/core.
        - pattern: ^time\.(Now|Since|Until|After|AfterFunc|Sleep|NewTimer|NewTicker|Tick)$
          msg: core reads no clock and starts no timer; the time comes with each event
    errcheck:
      check-blank: true # a blank drop needs //nolint:errcheck with a reason; nolintlint enforces the reason
    godox:
      keywords: [XXX, BUG] # the non-canonical spellings of WARN and FIXME
    errorlint:
      errorf: false # deliberate %v keeps foreign causes out of the %w contract chain
    sloglint:
      static-msg: true # variables go in attrs, not the message
      attr-only: true # typed attributes only, no key-value pairs
      no-raw-keys: true # a key must be a constant, not a literal; review keeps keys to internal/logattr
      key-naming-case: snake
    nolintlint:
      require-explanation: true
      require-specific: true
    gocognit:
      min-complexity: 20
    exhaustive:
      default-signifies-exhaustive: false # a default case never satisfies exhaustiveness
    gochecksumtype:
      default-signifies-exhaustive: false # same rule for sealed interfaces
    revive:
      rules:
        - name: context-as-argument
        - name: deep-exit
  exclusions:
    rules:
      - path-except: internal/daemon/core/
        linters:
          - forbidigo # the clock rule is for the pure core only
      - path: _test\.go
        linters:
          - err113 # ad-hoc errors are fine in test bodies
          - gochecknoglobals

issues:
  uniq-by-line: false # report every finding, even on the same line

formatters:
  enable:
    - gofmt
